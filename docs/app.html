<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Huzz</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="index.html">← Home</a>
      <span class="topbar-title">Huzz</span>
      <button type="button" id="profileBtn" class="hidden">Profile</button>
    </header>

    <main class="main no-nav" id="main"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main">
      <button type="button" class="nav-item on" data-screen="discover"><span class="icon">✦</span>Home</button>
      <button type="button" class="nav-item" data-screen="chats"><span class="icon">💬</span>Chats</button>
      <button type="button" class="nav-item" data-screen="social"><span class="icon">👥</span>Social</button>
      <button type="button" class="nav-item" data-screen="clubs"><span class="icon">🎙</span>Clubs</button>
      <button type="button" class="nav-item" data-screen="live"><span class="icon">📹</span>Live</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithCustomToken, signOut,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import {
      getFirestore, collection, query, where, getDocs, getDoc, orderBy, limit,
      doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, runTransaction,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';
    import { createWebApp } from './web-app.js?v=10';

    const firebaseConfig = {
      apiKey: 'AIzaSyB_k9w2F0I591-8mUyuHr_5B-TVQea0Tfo',
      authDomain: 'huzz-10264.firebaseapp.com',
      projectId: 'huzz-10264',
      storageBucket: 'huzz-10264.firebasestorage.app',
      messagingSenderId: '19254029866',
      appId: '1:19254029866:web:fe891e5819c8c94c589d53',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app, 'us-central1');
    const params = new URLSearchParams(location.search);
    const startMode = params.get('mode') === 'login' ? 'login' : params.get('mode') === 'signup' ? 'signup' : 'welcome';

    const webApp = createWebApp({
      auth, db, functions,
      getAuth, signInWithEmailAndPassword, signInWithCustomToken, signOut,
      getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc,
      setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, runTransaction,
      httpsCallable, onAuthStateChanged,
      main: document.getElementById('main'),
      bottomNav: document.getElementById('bottomNav'),
      profileBtn: document.getElementById('profileBtn'),
    });
    webApp.start(startMode);
  </script>
</body>
</html>
