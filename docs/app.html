<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Huzz</title>
  <link rel="icon" href="assets/icon-512.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #e11d48;
      --blue: #2563eb;
      --max: 400px;
      --gutter: 16px;
      --nav-h: 62px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: Inter, system-ui, sans-serif;
      background: #1da1f2;
      background-image: linear-gradient(180deg, #1da1f2 0%, #1991db 100%);
      color: var(--text);
    }
    .app {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top)) var(--gutter) 10px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .topbar a, .topbar button {
      background: none;
      border: none;
      color: var(--blue);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }
    .topbar-title {
      font-family: "Kaushan Script", cursive;
      font-size: 1.35rem;
    }
    .main {
      flex: 1;
      overflow: auto;
      padding: var(--gutter);
      padding-bottom: calc(var(--nav-h) + var(--gutter) + env(safe-area-inset-bottom));
    }
    .main.no-nav { padding-bottom: var(--gutter); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-family: "Kaushan Script", cursive;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }
    .card p.sub {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: #f8fafc;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      margin-top: 16px;
      border: none;
      border-radius: 22px;
      font-family: "Kaushan Script", cursive;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 2px solid rgba(37,99,235,0.35);
      margin-top: 10px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .err {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff1f2;
      border: 1px solid #fda4af;
      color: #be123c;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .ok {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #047857;
      font-size: 0.82rem;
    }
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: var(--max);
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px var(--gutter) max(8px, env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .bottom-nav.on { display: grid; }
    .nav-item {
      border: none;
      background: transparent;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-item span.icon { font-size: 1.1rem; }
    .nav-item.on { color: var(--blue); background: #eff6ff; }
    .list-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; }
    .list-item strong { font-size: 0.9rem; display: block; }
    .list-item span { font-size: 0.78rem; color: var(--muted); }
    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      background: #eff6ff;
      color: var(--blue);
      margin-top: 4px;
    }
    .hidden { display: none !important; }
    .step-hint { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }

    /* Discover */
    .discover-wrap { margin-bottom: 8px; }
    .discover-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .discover-photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
    }
    .discover-photo-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .discover-meta { padding: 14px 16px; }
    .discover-meta strong { font-size: 1.05rem; display: block; }
    .discover-loc { font-size: 0.78rem; color: var(--muted); }
    .discover-bio { font-size: 0.82rem; color: var(--muted); margin-top: 8px; line-height: 1.45; }
    .discover-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 16px 0 8px;
    }
    .disc-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }
    .disc-pass { background: #fff; color: #64748b; border: 2px solid var(--border); }
    .disc-like { background: var(--accent); color: #fff; }
    .discover-count { text-align: center; font-size: 0.72rem; color: var(--muted); }

    /* Chat / club threads */
    .thread-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .thread-back {
      border: none;
      background: none;
      color: var(--blue);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0;
    }
    .thread-msgs {
      min-height: 280px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .live-msgs { min-height: 200px; max-height: 36vh; }
    .bubble {
      max-width: 85%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .bubble.mine {
      align-self: flex-end;
      background: #dbeafe;
      color: #0f172a;
      border-bottom-right-radius: 4px;
    }
    .bubble.theirs {
      align-self: flex-start;
      background: #f1f5f9;
      color: #0f172a;
      border-bottom-left-radius: 4px;
    }
    .thread-compose {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .thread-compose input {
      flex: 1;
      margin: 0;
      padding: 11px 12px;
      border-radius: 12px;
    }
    .thread-compose button {
      border: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
    }
    .list-btn {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 12px 0;
    }
    .list-btn:hover { background: #f8fafc; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 10px; }
    .club-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .club-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .mini-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .mini-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .live-session .btn-outline { margin-top: 10px; }
    .live-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="index.html">← Home</a>
      <span class="topbar-title">Huzz</span>
      <button type="button" id="logoutBtn" class="hidden">Log out</button>
    </header>

    <main class="main no-nav" id="main">
      <!-- Auth screens injected by JS -->
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main">
      <button type="button" class="nav-item on" data-screen="discover"><span class="icon">✦</span>Discover</button>
      <button type="button" class="nav-item" data-screen="chats"><span class="icon">💬</span>Chats</button>
      <button type="button" class="nav-item" data-screen="clubs"><span class="icon">🎙</span>Clubs</button>
      <button type="button" class="nav-item" data-screen="live"><span class="icon">⚡</span>Live</button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithCustomToken, signOut,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import {
      getFirestore, collection, query, where, getDocs, getDoc, orderBy, limit,
      doc, setDoc, addDoc, updateDoc, onSnapshot, serverTimestamp, runTransaction,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';
    import { createWebApp } from './web-app.js?v=5';

    const firebaseConfig = {
      apiKey: 'AIzaSyB_k9w2F0I591-8mUyuHr_5B-TVQea0Tfo',
      authDomain: 'huzz-10264.firebaseapp.com',
      projectId: 'huzz-10264',
      storageBucket: 'huzz-10264.firebasestorage.app',
      messagingSenderId: '19254029866',
      appId: '1:19254029866:web:fe891e5819c8c94c589d53',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app, 'us-central1');
    const params = new URLSearchParams(location.search);
    const startMode = params.get('mode') === 'login' ? 'login' : params.get('mode') === 'signup' ? 'signup' : 'welcome';

    const webApp = createWebApp({
      auth, db, functions,
      getAuth, signInWithEmailAndPassword, signInWithCustomToken, signOut,
      getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc,
      setDoc, addDoc, updateDoc, onSnapshot, serverTimestamp, runTransaction,
      httpsCallable, onAuthStateChanged,
      main: document.getElementById('main'),
      bottomNav: document.getElementById('bottomNav'),
      logoutBtn: document.getElementById('logoutBtn'),
    });
    webApp.start(startMode);
  </script>
</body>
</html>
